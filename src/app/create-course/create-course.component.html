<div class="create-course-container">
    <h2>Create Course</h2>
    <form (ngSubmit)="createCourse()">
      <div class="form-group">
        <label>Course Name</label>
        <input 
          type="text" 
          class="form-control" 
          [(ngModel)]="courseName" 
          name="courseName" 
          required
        />
      </div>
      <div class="form-group">
        <label>Course Description</label>
        <textarea 
          class="form-control" 
          [(ngModel)]="courseDescription" 
          name="courseDescription" 
          required
        ></textarea>
      </div>
      <h3>Assign Students</h3>
      <div *ngIf="availableStudents$ | async as students">
        <div *ngFor="let student of students">
          <label>
            <input 
              type="checkbox" 
              [value]="student.uid" 
              (change)="onStudentCheckboxChange($event)"
            />
            {{ student.email }} ({{ student.role }})
          </label>
        </div>
      </div>
      <button type="submit" class="btn-black">
        Create Course
      </button>
    </form>
    <p *ngIf="message">{{ message }}</p>
  </div>
