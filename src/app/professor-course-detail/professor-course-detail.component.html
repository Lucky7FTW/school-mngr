<div *ngIf="course" class="dashboard-container">
  <!-- back button -->
  <button class="close" (click)="goBack()">← Back</button>

  <h2>Edit Course: {{ course.name }}</h2>
  <p>{{ course.description }}</p>

  <!-- invite row -->
  <h3>Assign Students &amp; 7-Session Attendance</h3>
  <div *ngIf="allStudents$ | async as students" class="dropdown-container">
    <select [(ngModel)]="selectedStudentUid">
      <option value="" disabled>Select a student</option>
      <option *ngFor="let s of students" [value]="s.uid">
        {{ s.email }}
      </option>
    </select>
    <button (click)="addSelectedStudent()">Invite</button>
  </div>
  <p class="error">{{ updateMessage }}</p>

  <!-- plain fallback table -->
  <table class="attendance-table">
    <thead>
      <tr>
        <th class="email-col">Student&nbsp;E-mail</th>
        <th *ngFor="let s of sessions">S{{ s + 1 }}</th>
        <th>Remove</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let uid of course.assignedStudents">
        <td class="email-col">{{ getStudentEmail(uid) }}</td>
        <td *ngFor="let idx of sessions">
          <input
            type="checkbox"
            [checked]="course.attendanceRecords![uid][idx]"
            (change)="toggleAttendance(uid, idx, $any($event.target).checked)" />
        </td>
        <td>
          <button (click)="removeStudent(uid)">Remove</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- optional Ag-Grid (renders only if rowData is non-empty) -->
  <app-attendance-grid
      *ngIf="rowData.length"
      [rowData]="rowData">
  </app-attendance-grid>

  <!-- save -->
  <button (click)="saveCourseChanges()">Save Changes</button>
</div>
