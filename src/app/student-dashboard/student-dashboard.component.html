<div class="dashboard-container">
  <!-- Top row with logout button -->
  <div style="text-align: right; margin-bottom: 15px;">
    <button class="w3-button w3-red" (click)="onLogout()">
      Logout
    </button>
  </div>

  <h1>Student Dashboard</h1>
  <p>Welcome to your student dashboard! Below are your assigned courses.</p>
  
  <hr />

  <h2>Your Courses</h2>
  <table class="courses-table">
    <thead>
      <tr>
        <th>Course Name</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let course of courses$ | async"
        (click)="onCourseClick(course)"
        style="cursor: pointer;"
      >
        <td>{{ course.name }}</td>
        <td>{{ course.description }}</td>
      </tr>
    </tbody>
  </table>
</div>
