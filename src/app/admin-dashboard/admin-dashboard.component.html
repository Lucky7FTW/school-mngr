<div class="dashboard-container">
  <!-- Top row with Logout button -->
  <div style="text-align: right; margin-bottom: 15px;">
    <button class="w3-button w3-red" (click)="onLogout()">
      Logout
    </button>
  </div>

  <h1>Admin Dashboard</h1>
  <p>Welcome to your admin dashboard!</p>

  <!-- BUTTON: CREATE COURSE (opens a modal) -->
  <button class="w3-button w3-black" (click)="openCreateCourseModal()">
    Create Course
  </button>

  <!-- CREATE COURSE MODAL -->
  <div class="modal" *ngIf="isCreateCourseModalOpen">
    <div class="modal-content">
      <span class="close" (click)="closeCreateCourseModal()">&times;</span>
      <h2>Create Course</h2>
      <form (ngSubmit)="createCourse()">
        <p>
          <label>Course Name</label>
          <input
            type="text"
            class="w3-input"
            [(ngModel)]="courseName"
            name="courseName"
            required
          />
        </p>
        <p>
          <label>Course Description</label>
          <textarea
            class="w3-input"
            [(ngModel)]="courseDescription"
            name="courseDescription"
            required
          ></textarea>
        </p>

        <p>
          <label>Assign Professor</label>
          <select
            [(ngModel)]="selectedProfessorUid"
            name="professorUid"
            required
          >
            <option value="" disabled>Select a professor</option>
            <option
              *ngFor="let prof of professors$ | async"
              [value]="prof.uid"
            >
              {{ prof.email }}
            </option>
          </select>
        </p>

        <button class="w3-button w3-black" type="submit">
          Create Course
        </button>
      </form>
      <p *ngIf="createCourseMessage">{{ createCourseMessage }}</p>
    </div>
  </div>

  <hr />

  <h2>All Courses</h2>
  <table class="courses-table">
    <thead>
      <tr>
        <th>Course Name</th>
        <th>Professor</th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let course of courses$ | async"
      >
        <td>{{ course.name }}</td>
        <td>{{ professorEmailMap[course.professorId ?? ''] || 'N/A' }}</td>
      </tr>
    </tbody>
  </table>
</div>
