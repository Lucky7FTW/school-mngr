<!-- DASHBOARD CONTENT -->
<div class="dashboard-container">
  <!-- logout -->
  <div class="logout-row">
    <button class="w3-button w3-red" (click)="onLogout()">Logout</button>
  </div>

  <h1>Admin Dashboard</h1>
  <p>Welcome to your admin dashboard!</p>

  <!-- create course -->
  <button class="w3-button w3-black" (click)="openCreateCourseModal()">
    Create Course
  </button>

  <hr />

  <!-- course table -->
  <h2>All Courses</h2>
  <table class="courses-table">
    <thead>
    <tr><th>Course Name</th><th>Professor</th><th>Actions</th></tr>
    </thead>
    <tbody>
    <tr *ngFor="let c of courses$ | async">
      <td>{{ c.name }}</td>
      <td>{{ professorEmailMap[c.professorId || ''] || 'N/A' }}</td>
      <td>
        <button class="w3-button w3-red w3-small"
                (click)="promptDelete(c.id!)">
          Delete
        </button>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<!-- ───────── CREATE‑COURSE MODAL ───────── -->
<div class="modal" *ngIf="isCreateCourseModalOpen">
  <div class="modal-content create-course">
    <button class="close" (click)="closeCreateCourseModal()">×</button>
    <h2>Create Course</h2>

    <form (ngSubmit)="createCourse()">
      <p>
        <label>Course Name</label><br>
        <input class="w3-input" [(ngModel)]="courseName" name="courseName" required>
      </p>
      <p>
        <label>Description</label><br>
        <textarea class="w3-input" [(ngModel)]="courseDescription" name="courseDescription" required></textarea>
      </p>
      <p>
        <label>Assign Professor</label><br>
        <select class="w3-select" [(ngModel)]="selectedProfessorUid" name="professorUid" required>
          <option value="" disabled>Select a professor</option>
          <option *ngFor="let p of professors$ | async" [value]="p.uid">
            {{ p.email }}
          </option>
        </select>
      </p>

      <button class="w3-button w3-black" type="submit">Create Course</button>
      <p class="error-msg">{{ createCourseMessage }}</p>
    </form>
  </div>
</div>

<!-- ───────── DELETE CONFIRM MODAL ───────── -->
<div class="modal" *ngIf="courseToDeleteId">
  <div class="modal-content confirm">
    <p>Are you sure you want to delete this course?</p>
    <div class="btn-row">
      <button class="w3-button w3-red"  (click)="confirmDelete()">Yes, Delete</button>
      <button class="w3-button w3-black" (click)="cancelDelete()">No, Cancel</button>
    </div>
  </div>
</div>
